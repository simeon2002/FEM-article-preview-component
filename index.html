<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />

    <title>Frontend Mentor | Article preview component</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <main>
      <article class="article">
        <img src="./images/drawers.jpg" alt="" class="article__img" />
        <div class="article__text-box">
          <h1 class="article__title">Shift the overall look and feel by adding these wonderful touches to furniture in your home</h1>
          <p class="article__desc">
            Ever been in a room and felt like something was missing? Perhaps it felt slightly bare and uninviting. I’ve got some simple tips
            to help you make any room feel complete.
          </p>
          <footer class="article__footer">
            <figure class="article__author-information">
              <img src="./images/avatar-michelle.jpg" alt="Profile image of Michelle Appleton" class="aritcle__author-img" />
              <figcaption "><p class="article__author-name">Michelle Appleton</p> <span class="article__publication-date">28 Jun 2020</span></figcaption>
            </figure>
            <button class="btn btn--share">Share</button>
          </footer>
        </div>
      </article>
    </main>
  </body>
</html>
