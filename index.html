<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="style.css" />

    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />

    <title>Article preview component</title>
  </head>
  <body>
    <main>
      <article class="article">
        <img src="./images/drawers.jpg" alt="" class="article__img" />
        <div class="article__text-box">
          <h1 class="article__title">Shift the overall look and feel by adding these wonderful touches to furniture in your home</h1>
          <p class="article__desc">
            Ever been in a room and felt like something was missing? Perhaps it felt slightly bare and uninviting. I’ve got some simple tips
            to help you make any room feel complete.
          </p>
          <footer class="article__footer">
            <img src="./images/avatar-michelle.jpg" alt="Profile image of Michelle Appleton" class="aritcle__author-img" />
            <div class="article__info">
              <p class="article__author-name">Michelle Appleton</p>
              <time datetime="2020-06-28">28 Jun 2020</time>
            </div>

            <button class="btn btn--share"><ion-icon name="share-outline" class="article__share-icon"></ion-icon></button>
          </footer>
        </div>
      </article>
    </main>
    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
  </body>
</html>
